// What every Java project of the build shares (common/ and each Minecraft version of the client). Applied by each
// project itself rather than from the root build, so Stonecutter's version projects are set up in their own order.
group = project.maven_group
version = project.mod_version

apply plugin: 'java'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// The Java the code is written for: 25 (what 26.x runs on) unless a project says otherwise (java_release in a
// Minecraft version's gradle.properties: 1.20.5 to 1.21.11 run on Java 21). It still compiles with Java 25.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = (project.findProperty('java_release') ?: '25') as int
}

repositories {
	mavenCentral()
}
