// The Fabric part of a client project's build (build.gradle applies it): Loom, Fabric API, the development and
// production runs, and the jars for mod sites (the store jar; for 1.21.1 also the NeoForge one).

// The development test harness (screenshots, diagnostics) is only on the maintainer's computer, not in the repository.
def harness = file('../../src/testmod').isDirectory()

sourceSets {
	// Each source set keeps its default folders here (src/main/java...): Stonecutter adds the shared ones in Mod/src.
	// Development-only test harness (screenshots and diagnostics); never part of the released jar.
	if (harness) {
		testmod {
			compileClasspath += main.compileClasspath + main.output
			runtimeClasspath += main.runtimeClasspath + main.output
		}
	}
}

loom {
	mods {
		"orbit_cosmetic" {
			sourceSet sourceSets.main
		}
		if (harness) {
			"orbit_cosmetic_testharness" {
				sourceSet sourceSets.testmod
			}
		}
	}
	runs {
		configureEach {
			// A run directory per Minecraft version, outside the source tree.
			runDir = System.getenv('ORBIT_RUN_DIR') ?: "../../../run/client-${project.minecraft_version}"
			vmArgs '-Xmx2G'
		}
		if (harness) testClient {
			client()
			name = 'Test Client'
			source sourceSets.testmod
			programArgs '--width', System.getenv('ORBIT_TEST_WIDTH') ?: '960', '--height', System.getenv('ORBIT_TEST_HEIGHT') ?: '540'
			if (System.getenv('ORBIT_TEST_USERNAME')) {
				programArgs '--username', System.getenv('ORBIT_TEST_USERNAME')
			}
			// Your own account for website screenshots with Orbit Cloud: a file with three lines (name, UUID, access
			// token, each may start with a "label:") that is read here and never copied anywhere. Development runs only.
			if (System.getenv('ORBIT_TEST_SESSION_FILE')) {
				def session = new File(System.getenv('ORBIT_TEST_SESSION_FILE')).readLines().findAll { it.trim() }
					.collect { it.contains(':') ? it.substring(it.indexOf(':') + 1).trim() : it.trim() }
				programArgs '--username', session[0], '--uuid', session[1], '--accessToken', session[2], '--userType', 'msa'
			}
			// A local fake of Mojang's profile API and texture host (see the skins test), with a dummy token.
			if (System.getenv('ORBIT_TEST_MOJANG')) {
				vmArgs "-Dorbit.mojangApi=${System.getenv('ORBIT_TEST_MOJANG')}", "-Dorbit.mojangTextures=${System.getenv('ORBIT_TEST_MOJANG')}"
				programArgs '--accessToken', 'orbit-test-token-not-a-real-one'
			}
			// The launch update check (normally skipped in development): -D options for the test, such as
			// ORBIT_TEST_UPDATE="-Dorbit.updateCheck=force -Dorbit.updateAnswer=yes -Dorbit.updateMods=/tmp/mods".
			if (System.getenv('ORBIT_TEST_UPDATE')) {
				vmArgs System.getenv('ORBIT_TEST_UPDATE').split(' ')
			}
			// A local test Orbit Cloud instead of the real one (development runs only), e.g. http://127.0.0.1:8000.
			if (System.getenv('ORBIT_TEST_BACKEND')) {
				vmArgs "-Dorbit.backendUrl=${System.getenv('ORBIT_TEST_BACKEND')}"
			}
			// The host window as if e4mc were installed (the world only goes on LAN).
			if (System.getenv('ORBIT_TEST_HOST')) {
				vmArgs '-Dorbit.testE4mc=true'
			}
			// The player a development backend should take this client for: "<uuid> <name>" (friends tests).
			if (System.getenv('ORBIT_TEST_DEV_PLAYER')) {
				vmArgs "-Dorbit.devPlayer=${System.getenv('ORBIT_TEST_DEV_PLAYER')}"
			}
			// The "title" role stays on the title screen; the others join the local test server.
			if (System.getenv('ORBIT_TEST_ROLE') != 'title') {
				programArgs '--quickPlayMultiplayer', 'localhost:25599'
			}
		}
	}
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		// Only for the Configure button in Mod Menu's list; the mod runs without Mod Menu.
		modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	}
}

processResources {
	def properties = [version: project.version, minecraft: project.minecraft_dependency, target: project.minecraft_version,
		java: project.findProperty('java_release') ?: '25']
	inputs.properties properties
	filesMatching(['fabric.mod.json', 'orbit_cosmetic.mixins.json']) {
		expand properties
	}
}

// The jar players get: the remapped one where Minecraft is obfuscated (the plain jar has development names there).
ext.releaseJar = obfuscated ? 'remapJar' : 'jar'

// The game as players run it, with the jar players get and Fabric API only (no development names, no harness), on
// the Java that Minecraft version uses: ./gradlew :Mod:<version>:prodClient. ORBIT_PROD_SERVER joins a server at once;
// ORBIT_RUN_DIR picks the game folder (run/prod-<version> otherwise). ORBIT_PROD_MINECRAFT and ORBIT_PROD_FABRIC_API
// run another release the jar is for (1.21.9 for the 1.21.10 jar) with that release's Fabric API.
tasks.register('prodClient', productionRunTask) {
	group = 'fabric'
	description = 'Runs the release jar in a normal (non-development) game.'
	mods.from(tasks.named(releaseJar))
	def gameVersion = System.getenv('ORBIT_PROD_MINECRAFT') ?: project.minecraft_version
	mods.from(configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${System.getenv('ORBIT_PROD_FABRIC_API') ?: project.fabric_api_version}")).setTransitive(false))
	if (gameVersion != project.minecraft_version) {
		minecraftVersion = gameVersion
	}
	runDir = file(System.getenv('ORBIT_RUN_DIR') ?: "../../../run/prod-${gameVersion}")
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of((project.findProperty('java_release') ?: '25') as int) }
	programArgs.addAll('--username', System.getenv('ORBIT_TEST_USERNAME') ?: 'OrbitTester')
	if (System.getenv('ORBIT_PROD_SERVER')) {
		programArgs.addAll('--quickPlayMultiplayer', System.getenv('ORBIT_PROD_SERVER'))
	}
}

// The build for mod sites (Modrinth, CurseForge): the same mod without its self-updater, since those sites update
// mods themselves and refuse mods that replace their own files. Leaves out the update package, the release key and
// the preLaunch entrypoint that starts the update check: orbit-mod-mc<version>-<mod version>-store.jar.
def storeMeta = layout.buildDirectory.dir('store-meta')
def storeMetadata = tasks.register('storeMetadata') {
	dependsOn tasks.named('processResources')
	def source = layout.buildDirectory.file('resources/main/fabric.mod.json')
	inputs.file source
	outputs.dir storeMeta
	doLast {
		def json = new groovy.json.JsonSlurper().parse(source.get().asFile)
		json.entrypoints.remove('preLaunch')
		def out = storeMeta.get().file('fabric.mod.json').asFile
		out.parentFile.mkdirs()
		out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
	}
}
def storeJar = tasks.register('storeJar', Zip) {
	group = 'build'
	description = 'Builds the jar for mod sites, without self-updating.'
	dependsOn tasks.named(releaseJar), storeMetadata
	archiveBaseName = base.archivesName
	archiveVersion = project.version
	archiveClassifier = 'store'
	archiveExtension = 'jar'
	destinationDirectory = layout.buildDirectory.dir('libs')
	from({ zipTree(tasks.named(releaseJar).get().archiveFile) }) {
		exclude 'dev/orbit/cosmetic/client/update/**', 'orbit-release.pub', 'fabric.mod.json'
	}
	from(storeMeta)
	doLast {
		// Nothing left may refer to the updater.
		def jar = archiveFile.get().asFile
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			zip.entries().each { entry ->
				if (!entry.directory && entry.name.endsWith('.class')) {
					def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
					if (text.contains('dev/orbit/cosmetic/client/update/')) {
						throw new GradleException("${entry.name} still refers to the updater; the store jar would not work")
					}
				}
			}
		}
	}
}
tasks.named('build') {
	dependsOn storeJar
}

// What goes to mod sites, by name in the store release's list.
ext.storeJars = [(project.minecraft_version): 'storeJar']

// NeoForge 1.21.1: Sinytra Connector runs Fabric mods there (with Forgified Fabric API). This is the store jar with
// its fabric.mod.json made for that: it asks for Connector, names its target "neoforge-1.21.1", and leaves the Fabric
// Loader version to Connector (which brings its own). The code finds out by itself that it runs on NeoForge.
if (stonecutter.current.version == '1.21.1') {
	def neoforgeMeta = layout.buildDirectory.dir('neoforge-meta')
	def neoforgeMetadata = tasks.register('neoforgeMetadata') {
		dependsOn storeMetadata
		inputs.dir storeMeta
		outputs.dir neoforgeMeta
		doLast {
			def json = new groovy.json.JsonSlurper().parse(storeMeta.get().file('fabric.mod.json').asFile)
			json.custom['orbit_cosmetic:target'] = "neoforge-${project.minecraft_version}".toString()
			json.depends.remove('fabricloader')
			json.depends.neoforge = '*'
			def out = neoforgeMeta.get().file('fabric.mod.json').asFile
			out.parentFile.mkdirs()
			out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
		}
	}
	def neoforgeJar = tasks.register('neoforgeJar', Zip) {
		group = 'build'
		description = 'Builds the jar for NeoForge with Sinytra Connector (mod sites only).'
		dependsOn storeJar, neoforgeMetadata
		archiveBaseName = "orbit-mod-mc${project.minecraft_version}-neoforge"
		archiveVersion = project.version
		archiveExtension = 'jar'
		destinationDirectory = layout.buildDirectory.dir('libs')
		from({ zipTree(storeJar.get().archiveFile) }) {
			exclude 'fabric.mod.json'
		}
		from(neoforgeMeta)
	}
	tasks.named('build') {
		dependsOn neoforgeJar
	}
	ext.storeJars["neoforge-${project.minecraft_version}".toString()] = 'neoforgeJar'
}
