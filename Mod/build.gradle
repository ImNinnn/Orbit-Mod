// Build of the Orbit client for one Minecraft version and mod loader: every project Stonecutter makes in versions/
// (see settings.gradle) runs this script. The code in ../../src is shared; versions/<project>/src holds the classes
// that differ for that project (a Forge project also takes its Minecraft version's), and the project's
// gradle.properties picks Minecraft and the loader's libraries. Stonecutter adds the shared sources itself, as
// processed for the version. What differs between loaders is in fabric.gradle and forge.gradle.
apply from: rootProject.file('gradle/java.gradle')
// The loader: Fabric unless the project's name says otherwise ("1.20.1-forge").
def loader = stonecutter.current.project.contains('-') ? stonecutter.current.project.substring(stonecutter.current.project.indexOf('-') + 1) : 'fabric'
ext.loader = loader
// Minecraft before 26.1 is obfuscated (Loom or ModDevGradle maps it to Mojang's names).
ext.obfuscated = stonecutter.eval(stonecutter.current.version, '<26.1')
if (loader == 'forge') {
	apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
	apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
}

// Names Minecraft changed: the shared code uses the newest; older versions get theirs (both ways, so switching the
// active version round-trips).
stonecutter {
	// "//? if forge {" for Forge-only code (and "fabric" for Fabric-only).
	constants.match(loader, 'fabric', 'forge')
	replacements {
		regex(stonecutter.eval(stonecutter.current.version, '<26.1')) {
			// 26.1 renamed the GUI's drawing object.
			replace('\\bGuiGraphicsExtractor\\b', 'GuiGraphics', '\\bGuiGraphics\\b', 'GuiGraphicsExtractor')
		}
		def pre26 = stonecutter.eval(stonecutter.current.version, '<26.1')
		def pre1_21_11 = stonecutter.eval(stonecutter.current.version, '<1.21.11')
		def pre1_21_9 = stonecutter.eval(stonecutter.current.version, '<1.21.9')
		def pre1_21_2 = stonecutter.eval(stonecutter.current.version, '<1.21.2')
		def pre1_21 = stonecutter.eval(stonecutter.current.version, '<1.21')
		def pre1_20_2 = stonecutter.eval(stonecutter.current.version, '<1.20.2')
		// Each pair: the newer name (in the shared code) and the older one, as regexes and replacements, for the
		// versions where "older" is true (optionally in one file only).
		def renames = { boolean older, List<List<String>> pairs, String file = null ->
			pairs.each { pair ->
				regex(older) {
					if (file != null) {
						include file
					}
					replace(pair[0], pair[1], pair[2], pair[3])
				}
			}
		}
		// 26.1 renamed the GUI's "render" methods "extract".
		renames(pre26, [
			['\\bextractWidgetRenderState\\b', 'renderWidget', '\\brenderWidget\\b', 'extractWidgetRenderState'],
			['\\bextractContent\\b', 'renderContent', '\\brenderContent\\b', 'extractContent'],
			['\\bextractBackground\\b', 'renderBackground', '\\brenderBackground\\b', 'extractBackground'],
			['\\bInventoryScreen\\.extractEntityInInventoryFollowsMouse\\b', 'InventoryScreen.renderEntityInInventoryFollowsMouse',
			 '\\bInventoryScreen\\.renderEntityInInventoryFollowsMouse\\b', 'InventoryScreen.extractEntityInInventoryFollowsMouse'],
			['\\bextractEntityInInventoryFollowsMouse\\b', 'renderEntityInInventoryFollowsMouse', '\\brenderEntityInInventoryFollowsMouse\\b', 'extractEntityInInventoryFollowsMouse'],
			['\\.getDefaultClockTime\\(\\)', '.getDayTime()', '\\.getDayTime\\(\\)', '.getDefaultClockTime()'],
			['\\bextractMenuBackgroundTexture\\b', 'renderMenuBackgroundTexture', '\\brenderMenuBackgroundTexture\\b', 'extractMenuBackgroundTexture'],
			['\\baddPicturesInPictureState\\b', 'submitPicturesInPictureState', '\\bsubmitPicturesInPictureState\\b', 'addPicturesInPictureState'],
			['\\bextractListSeparators\\b', 'renderListSeparators', '\\brenderListSeparators\\b', 'extractListSeparators'],
			['net/minecraft/client/renderer/state/level/(CameraRenderState|LevelRenderState)\\b', 'net/minecraft/client/renderer/state/$1',
			 'net/minecraft/client/renderer/state/(CameraRenderState|LevelRenderState)\\b', 'net/minecraft/client/renderer/state/level/$1'],
			// Render states moved packages.
			['net\\.minecraft\\.client\\.renderer\\.state\\.level\\.(CameraRenderState|LevelRenderState)\\b', 'net.minecraft.client.renderer.state.$1',
			 'net\\.minecraft\\.client\\.renderer\\.state\\.(CameraRenderState|LevelRenderState)\\b', 'net.minecraft.client.renderer.state.level.$1'],
			['net\\.minecraft\\.client\\.renderer\\.state\\.gui\\.', 'net.minecraft.client.gui.render.state.', 'net\\.minecraft\\.client\\.gui\\.render\\.state\\.', 'net.minecraft.client.renderer.state.gui.'],
			// Fabric API took Mojang's names in 26.1.
			['\\bScreenEvents\\.beforeExtract\\b', 'ScreenEvents.beforeRender', '\\bScreenEvents\\.beforeRender\\b', 'ScreenEvents.beforeExtract'],
			['\\bScreenEvents\\.afterExtract\\b', 'ScreenEvents.afterRender', '\\bScreenEvents\\.afterRender\\b', 'ScreenEvents.afterExtract'],
			['\\bScreens\\.getWidgets\\b', 'Screens.getButtons', '\\bScreens\\.getButtons\\b', 'Screens.getWidgets'],
			['\\bKeyMappingHelper\\.registerKeyMapping\\b', 'KeyBindingHelper.registerKeyBinding', '\\bKeyBindingHelper\\.registerKeyBinding\\b', 'KeyMappingHelper.registerKeyMapping'],
			['\\bclient\\.keymapping\\.v1\\.KeyMappingHelper\\b', 'client.keybinding.v1.KeyBindingHelper', '\\bclient\\.keybinding\\.v1\\.KeyBindingHelper\\b', 'client.keymapping.v1.KeyMappingHelper'],
			['\\bLivingEntityRenderLayerRegistrationCallback\\b', 'LivingEntityFeatureRendererRegistrationCallback', '\\bLivingEntityFeatureRendererRegistrationCallback\\b', 'LivingEntityRenderLayerRegistrationCallback'],
		])
		// 1.21.11 renamed ResourceLocation "Identifier" and moved Util and the player models.
		renames(pre1_21_11, [
			['\\bIdentifier\\b', 'ResourceLocation', '\\bResourceLocation\\b', 'Identifier'],
			['net\\.minecraft\\.util\\.Util\\b', 'net.minecraft.Util', 'net\\.minecraft\\.Util\\b', 'net.minecraft.util.Util'],
			['net\\.minecraft\\.world\\.entity\\.animal\\.cow\\.Cow\\b', 'net.minecraft.world.entity.animal.Cow', 'net\\.minecraft\\.world\\.entity\\.animal\\.Cow\\b', 'net.minecraft.world.entity.animal.cow.Cow'],
			['net\\.minecraft\\.client\\.model\\.player\\.(PlayerModel|PlayerCapeModel)\\b', 'net.minecraft.client.model.$1',
			 'net\\.minecraft\\.client\\.model\\.(PlayerModel|PlayerCapeModel)\\b', 'net.minecraft.client.model.player.$1'],
		])
		// Ctrl, or Cmd on a Mac: what hasControlDown meant before 1.21.11.
		renames(pre1_21_11, [['\\.hasControlDownWithQuirk\\(\\)', '.hasControlDown(/*withQuirk*/)', '\\.hasControlDown\\(/\\*withQuirk\\*/\\)', '.hasControlDownWithQuirk()']],
			'**/input/OrbitKey.java')
		// 1.21.9 made players "avatars" (mannequins draw like them) and moved PlayerSkin.
		renames(pre1_21_9, [
			['\\bAvatarRenderState\\b', 'PlayerRenderState', '\\bPlayerRenderState\\b', 'AvatarRenderState'],
			// PlayerRenderer is not generic: AvatarRenderer<?> becomes plain PlayerRenderer.
			['\\bAvatarRenderer(?:<\\?>|\\b)', 'PlayerRenderer', '\\bPlayerRenderer\\b', 'AvatarRenderer'],
			['net\\.minecraft\\.world\\.entity\\.player\\.PlayerSkin\\b', 'net.minecraft.client.resources.PlayerSkin',
			 'net\\.minecraft\\.client\\.resources\\.PlayerSkin\\b', 'net.minecraft.world.entity.player.PlayerSkin'],
		])
		// GameProfile was a class with getters before 1.21.9, and the session service hung off Minecraft itself.
		renames(pre1_21_9, [
			['\\b(getProfile|getGameProfile)\\(\\)\\.id\\(\\)', '$1().getId()', '\\b(getProfile|getGameProfile)\\(\\)\\.getId\\(\\)', '$1().id()'],
			['\\b(getProfile|getGameProfile)\\(\\)\\.name\\(\\)', '$1().getName()', '\\b(getProfile|getGameProfile)\\(\\)\\.getName\\(\\)', '$1().name()'],
			['\\.services\\(\\)\\.sessionService\\(\\)', '.getMinecraftSessionService()', '\\.getMinecraftSessionService\\(\\)', '.services().sessionService()'],
		])
		// Before 1.21.2: the frame timer had another name, and registries were read with get.
		renames(pre1_21_2, [
			['\\.getDeltaTracker\\(\\)', '.getTimer()', '\\.getTimer\\(\\)', '.getDeltaTracker()'],
			['\\bBuiltInRegistries\\.(\\w+)\\.getValue\\(', 'BuiltInRegistries.$1.get(', '\\bBuiltInRegistries\\.(\\w+)\\.get\\(', 'BuiltInRegistries.$1.getValue('],
		])
		// Before 1.21 names are made with ResourceLocation's constructors (the comments let the names go back), and the
		// frame's progress between ticks comes straight from Minecraft.
		renames(pre1_21, [
			['\\b(Identifier|ResourceLocation)\\.withDefaultNamespace\\(', 'new ResourceLocation(/*minecraft*/',
			 '\\bnew (Identifier|ResourceLocation)\\(/\\*minecraft\\*/', 'Identifier.withDefaultNamespace('],
			['\\b(Identifier|ResourceLocation)\\.parse\\(', 'new ResourceLocation(/*parse*/', '\\bnew (Identifier|ResourceLocation)\\(/\\*parse\\*/', 'Identifier.parse('],
			['\\b(Identifier|ResourceLocation)\\.fromNamespaceAndPath\\(', 'new ResourceLocation(', '\\bnew (Identifier|ResourceLocation)\\((?!/\\*)', 'Identifier.fromNamespaceAndPath('],
			['\\.(getDeltaTracker|getTimer)\\(\\)\\.getGameTimeDeltaPartialTick\\((true|false)\\)', '.getFrameTime(/*$2*/)',
			 '\\.getFrameTime\\(/\\*(true|false)\\*/\\)', '.getDeltaTracker().getGameTimeDeltaPartialTick($1)'],
		])
		// Before 1.20.2 a widget's right and bottom edges are its rectangle's.
		renames(pre1_20_2, [
			['\\bgetRight\\(\\)', 'getRectangle().right()', '\\bgetRectangle\\(\\)\\.right\\(\\)', 'getRight()'],
			['\\bgetBottom\\(\\)', 'getRectangle().bottom()', '\\bgetRectangle\\(\\)\\.bottom\\(\\)', 'getBottom()'],
			// and other names of that time
			['\\bDefaultPlayerSkin\\.getDefaultTexture\\(\\)', 'DefaultPlayerSkin.getDefaultSkin()', '\\bDefaultPlayerSkin\\.getDefaultSkin\\(\\)', 'DefaultPlayerSkin.getDefaultTexture()'],
			['\\bminecraft\\.getGameProfile\\(\\)', 'minecraft.getUser().getGameProfile()', '\\bminecraft\\.getUser\\(\\)\\.getGameProfile\\(\\)', 'minecraft.getGameProfile()'],
		])
		// Before 1.20.5 an effect instance holds the effect itself, not a registry holder.
		renames(stonecutter.eval(stonecutter.current.version, '<1.20.5'), [
			['\\.getEffect\\(\\)\\.value\\(\\)', '.getEffect()/*.value()*/', '\\.getEffect\\(\\)/\\*\\.value\\(\\)\\*/', '.getEffect().value()'],
		])
		// A screen's and a toast's own drawing method.
		['**/gui/ui/OrbitBaseScreen.java', '**/gui/OrbitToast.java'].each { file ->
			renames(pre26, [['\\bextractRenderState\\(', 'render(', '\\brender\\(', 'extractRenderState(']], file)
		}
		renames(pre26, [['\\bPlayerFaceExtractor\\.extractRenderState\\(', 'PlayerFaceRenderer.draw(', '\\bPlayerFaceRenderer\\.draw\\(', 'PlayerFaceExtractor.extractRenderState('],
			['\\bPlayerFaceExtractor\\b', 'PlayerFaceRenderer', '\\bPlayerFaceRenderer\\b', 'PlayerFaceExtractor']], '**/gfx/OrbitGraphics.java')
		// OrbitGraphics calls GuiGraphics by older names (only its field "graphics" is Minecraft's object).
		[['text', 'drawString'], ['centeredText', 'drawCenteredString'], ['item', 'renderItem'],
		 ['itemDecorations', 'renderItemDecorations']].each { names ->
			regex(pre26) {
				include '**/gfx/OrbitGraphics.java'
				replace("\\bgraphics\\.${names[0]}\\(", "graphics.${names[1]}(", "\\bgraphics\\.${names[1]}\\(", "graphics.${names[0]}(")
			}
		}
	}
}

base {
	archivesName = loader == 'fabric' ? "orbit-mod-mc${project.minecraft_version}" : "orbit-mod-mc${project.minecraft_version}-${loader}"
}

// A loader's project also takes the classes its Minecraft version's project has (versions/1.20.1 for 1.20.1-forge).
if (stonecutter.current.project != stonecutter.current.version) {
	sourceSets.main.java.srcDir("../${stonecutter.current.version}/src/main/java")
}
// A class in a project's own folders replaces the shared one of the same name (Forge's OrbitPlatform...).
def ownDirs = [file('src/main/java'), file("../${stonecutter.current.version}/src/main/java")].findAll { it.isDirectory() }
def ownClasses = ownDirs.collectMany { dir -> fileTree(dir).files.collect { dir.toPath().relativize(it.toPath()).toString().replace('\\', '/') } } as Set
sourceSets.main.java.exclude { element -> element.relativePath.pathString in ownClasses && !ownDirs.any { element.file.toPath().startsWith(it.toPath()) } }

dependencies {
	implementation project(':common')
	// Nullness annotations: Minecraft brings them since 1.21.11; older versions only need them to compile.
	compileOnly 'org.jspecify:jspecify:1.0.0'
}

jar {
	// Ship the shared library inside the mod jar.
	from(project(':common').sourceSets.main.output)
}

// Loom's production run (fabric.gradle), named here: scripts applied from a file cannot see plugin classes.
if (loader == 'fabric') {
	ext.productionRunTask = net.fabricmc.loom.task.prod.ClientProductionRunTask
}
apply from: parent.file("${loader == 'fabric' ? 'fabric' : 'forge'}.gradle")
