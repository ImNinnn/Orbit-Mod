org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric (verified against https://meta.fabricmc.net). Minecraft and Fabric API versions are set per client build in
# Mod/versions/<version>/gradle.properties.
loader_version=0.20.1
loom_version=1.19.3
# ModDevGradle, which builds the NeoForge 1.21.1 jar, and its Legacy plugin, the Forge 1.20.1 one
# (https://plugins.gradle.org/plugin/net.neoforged.moddev)
moddev_version=2.0.148

# Libraries bundled by Minecraft; common only compiles against them. Gson: the oldest one Orbit runs with (Minecraft
# 1.20.1 ships 2.10.1), so nothing newer can be used by mistake.
gson_version=2.10.1
slf4j_version=2.0.17

# The mod's version: every change adds 0.0.1 (0.1.0 was before the overhaul). Releases are published with
# ./gradlew publishRelease (see deploy/DEPLOYMENT.md).
mod_version=2.0.0
maven_group=dev.orbit.cosmetic
