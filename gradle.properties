org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric (verified against https://meta.fabricmc.net). Minecraft and Fabric API versions are set per client build in
# Mod/versions/<version>/gradle.properties.
loader_version=0.20.1
loom_version=1.19.3

# Libraries bundled by Minecraft; common only compiles against them
gson_version=2.14.0

# The mod's version: every change adds 0.0.1 (0.1.0 was before the overhaul). Releases are published with
# ./gradlew publishRelease (see deploy/DEPLOYMENT.md).
mod_version=1.0.5
maven_group=dev.orbit.cosmetic
